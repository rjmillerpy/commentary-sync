[project]
name = "commentary-sync"
version = "0.1.0"
description = "Phase 0 prototype: audio-based sync between a commentator's feed and a viewer's TV"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "av>=19.0.1",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sync-offset = "app.sync.views:main"
sync-benchmark = "app.simulation.views:main"
events-import = "app.events.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
# SQLAlchemy's async layer resumes code on greenlets; without this, lines
# after an `await db...` in a request look unexecuted.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Each family enforces part of CODE_QUALITY_RULES.md:
# ANN = full annotations (47), BLE/E722 = no blind or bare except (32, 33),
# PLR2004 = no magic numbers (8), C901/PLR0912/PLR0915 = small functions (1, 42),
# S = Bandit security checks.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN", "BLE", "PLR2004", "C901", "PLR0912", "PLR0915", "S"]

[tool.ruff.lint.isort]
# The local alembic/ directory holds migrations; `import alembic` is the library.
known-third-party = ["alembic"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests are full of made-up passwords and tokens. Trufflehog
# still scans tests/ for real ones.
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.mypy]
strict = true
files = [
    "app",
    "tests",
]
# tests/ has no __init__.py files, so name modules by path (tests.sync.test_schema).
explicit_package_bases = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit[toml]>=1.9.4",
    "fakeredis>=2.39.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "scipy-stubs>=1.18.1.1",
]

[tool.bandit]
# Scanned: app/ (see .pre-commit-config.yaml). Test code is excluded: pytest
# relies on `assert` (B101). Accepted findings in app code carry
# `# nosec <ID> - <reason>`.
exclude_dirs = ["tests", ".venv"]
