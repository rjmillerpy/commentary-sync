# Alembic configuration. The database URL is not here: alembic/env.py reads it
# from COMMENTARY_DATABASE_URL, like the app does.
[alembic]
script_location = alembic
# <revision>_<slug>.py, for example 0001_create_events.py.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
