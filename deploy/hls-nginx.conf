# The `hls` service in compose.yaml: serves the HLS the recorder writes, to
# listeners, read-only. A deployed stack serves it from S3 through CloudFront.
server {
    listen 8080;
    root /hls;
    server_tokens off;
    autoindex off;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        audio/aac aac;
    }
    default_type application/octet-stream;

    # add_header is not inherited by a location that sets its own, so every
    # location below repeats these.
    add_header X-Content-Type-Options nosniff always;
    # Players fetch across origins. Nothing here is private beyond its
    # unguessable path, so any origin may read it.
    add_header Access-Control-Allow-Origin * always;

    location = /health {
        access_log off;
        return 200;
    }

    # The playlist changes with every segment; a segment never changes.
    location ~ \.m3u8$ {
        limit_except GET { deny all; }
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin * always;
    }
}
