# D17: build both images, push them to ECR and move the ECS services to them.
#
# Manual only (Actions > deploy > Run workflow) until the user goes live:
# nothing runs on push, so it costs no Actions minutes and touches no AWS
# account until then. Credentials come from GitHub's OIDC token: no stored
# AWS key exists. The deploy role (infra/github.tf) trusts only this
# repository's main branch.
#
# Repository variables it needs (Settings > Secrets and variables > Variables):
#   AWS_REGION, AWS_ACCOUNT_ID, AWS_DEPLOY_ROLE_ARN (terraform output deploy_role_arn),
#   STUDIO_API_URL, STUDIO_LIVEKIT_URL (terraform output build_args).
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # to ask GitHub for the OIDC token

concurrency:
  group: deploy
  cancel-in-progress: false # never cut a deploy off halfway

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push the API image
        run: |
          docker build -t "$REGISTRY/commentary-sync-api:$TAG" .
          docker push "$REGISTRY/commentary-sync-api:$TAG"

      - name: Build and push the studio image
        env:
          API_URL: ${{ vars.STUDIO_API_URL }}
          LIVEKIT_URL: ${{ vars.STUDIO_LIVEKIT_URL }}
        run: |
          docker build -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL="$LIVEKIT_URL" \
            -t "$REGISTRY/commentary-sync-web:$TAG" .
          docker push "$REGISTRY/commentary-sync-web:$TAG"

      - name: Deploy
        run: infra/deploy.sh "$TAG"
