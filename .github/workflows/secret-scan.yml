name: Secret scan (full history)

# Weekly full-history scan. The per-push scan in ci.yml only looks at new
# commits; new Trufflehog detectors can still find old secrets, and a secret
# committed months ago counts as much as one committed today.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit on every branch

      # On schedule/workflow_dispatch the action scans the entire history.
      - name: Trufflehog (entire history)
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          # The action's scanner image defaults to "latest"; pin it too. Dependabot
          # bumps the `uses:` tag above but not this input: update both together.
          version: 3.99.2
          extra_args: --results=verified,unknown,unverified --exclude-paths=.trufflehog-exclude.txt
